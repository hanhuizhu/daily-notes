<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随想笔记 · daily notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================
   Design System — Design Tokens
   ============================================ */
:root {
  --c-bg: #f5f0eb;
  --c-bg-card: #fffcf8;
  --c-text: #2d2a24;
  --c-text-secondary: #8b8178;
  --c-text-muted: #b0a79e;
  --c-accent: #c8916a;
  --c-accent-hover: #b88055;
  --c-accent-subtle: #f0e6dc;
  --c-accent-glow: rgba(200, 145, 106, 0.12);
  --c-border: #e8e0d8;
  --c-border-light: #f0ebe5;
  --c-shadow: rgba(80, 60, 40, 0.06);
  --c-shadow-hover: rgba(80, 60, 40, 0.12);
  --font-serif: "Noto Serif SC","Source Han Serif SC","STSong",Georgia,serif;
  --font-sans: -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono: ui-monospace,"SF Mono","Cascadia Code",monospace;
  --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px; --space-xl:32px; --space-2xl:48px; --space-3xl:64px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --duration-fast:200ms; --duration-normal:400ms; --duration-slow:600ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }
body {
  font-family:var(--font-sans); background:var(--c-bg); color:var(--c-text); line-height:1.8;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(200,145,106,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(200,145,106,0.03) 0%, transparent 50%);
  background-attachment:fixed;
  min-height:100dvh;
}

/* ============================================
   Layout — Asymmetric Container
   ============================================ */
.container {
  max-width:680px;
  margin:0 auto;
  padding:var(--space-3xl) var(--space-lg);
  position:relative;
}

/* Decorative accent — offset circle for asymmetry */
.container::before {
  content:'';
  position:absolute;
  top:40px;
  right:-80px;
  width:200px;
  height:200px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(200,145,106,0.04) 0%, transparent 60%);
  pointer-events:none;
  display:none;
}
@media (min-width:1100px) {
  .container::before { display:block; }
}

/* ============================================
   WeChat Tip
   ============================================ */
.wx-tip {
  display:none;
  background:linear-gradient(135deg,#fef8e0,#fdf0d0);
  border:1px solid #f0dba8;
  border-radius:var(--radius-md);
  padding:12px 20px;
  margin-bottom:var(--space-lg);
  font-size:13px;
  color:#8d6e00;
  align-items:center;
  gap:8px;
  line-height:1.5;
}
.wx-tip strong { color:#b85a00; }
.wx-tip svg { flex-shrink:0; opacity:0.7; }

/* ============================================
   Header
   ============================================ */
.header {
  margin-bottom:var(--space-2xl);
  position:relative;
}
.header h1 {
  font-family:var(--font-serif);
  font-size:clamp(1.75rem,4vw,2.5rem);
  font-weight:700;
  letter-spacing:-0.02em;
  color:var(--c-text);
  line-height:1.3;
  display:flex;
  align-items:center;
  gap:12px;
}
.header h1 .header-icon {
  flex-shrink:0;
  color:var(--c-accent);
  opacity:0.7;
  width:clamp(22px,3vw,28px);
  height:clamp(22px,3vw,28px);
}
.header h1 .accent {
  color:var(--c-accent);
}
.header .sub {
  font-size:clamp(0.8125rem,1.5vw,0.9375rem);
  color:var(--c-text-secondary);
  margin-top:var(--space-sm);
  line-height:1.5;
  padding-left:clamp(34px,calc(22px + 12px),40px);
}
.header .line {
  width:96px;
  height:3px;
  background:linear-gradient(90deg,var(--c-accent),transparent);
  border-radius:2px;
  margin-top:var(--space-lg);
  margin-left:clamp(34px,calc(22px + 12px),40px);
}

/* ============================================
   Notes — Cards
   ============================================ */
@keyframes noteIn {
  from { opacity:0; transform:translateY(16px); }
  to { opacity:1; transform:translateY(0); }
}

.note {
  background:var(--c-bg-card);
  border:1px solid var(--c-border);
  border-radius:var(--radius-lg);
  padding:var(--space-xl) var(--space-lg);
  margin-bottom:var(--space-md);
  position:relative;
  transition:
    transform var(--duration-normal) var(--ease-out),
    box-shadow var(--duration-normal) var(--ease-out),
    border-color var(--duration-normal) var(--ease-out);
  box-shadow:
    0 1px 2px rgba(80,60,40,0.04),
    0 20px 40px -15px rgba(80,60,40,0.05);
  animation:noteIn 0.5s var(--ease-out) both;
}
.note::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:var(--radius-lg);
  background:linear-gradient(135deg,transparent 60%,rgba(200,145,106,0.02));
  pointer-events:none;
}
.note:hover {
  transform:translateY(-2px);
  box-shadow:0 4px 16px var(--c-shadow-hover),0 2px 4px rgba(80,60,40,0.06);
  border-color:var(--c-accent-subtle);
}
.note:active {
  transform:translateY(-1px);
}

/* Note meta row */
.note-meta {
  display:flex;
  align-items:center;
  gap:var(--space-sm);
  margin-bottom:var(--space-md);
  position:relative;
  z-index:1;
}

.note .index {
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  color:var(--c-accent);
  background:var(--c-accent-subtle);
  padding:2px 10px;
  border-radius:10px;
  letter-spacing:0.02em;
  line-height:1.6;
}

.note .date {
  font-size:12px;
  color:var(--c-text-muted);
  display:flex;
  align-items:center;
  gap:4px;
}
.note .date::before {
  content:'';
  display:inline-block;
  width:3px;
  height:3px;
  background:var(--c-text-muted);
  border-radius:50%;
  margin-right:2px;
}

/* Toggle button */
.note-toggle {
  margin-left:auto;
  cursor:pointer;
  user-select:none;
  display:flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:8px;
  transition:all var(--duration-fast) var(--ease-out);
  background:transparent;
  border:none;
  font-family:var(--font-sans);
  color:var(--c-text-muted);
  line-height:1;
}
.note-toggle:hover {
  color:var(--c-accent);
  background:var(--c-accent-glow);
}
.note-toggle:focus-visible {
  outline:2px solid var(--c-accent);
  outline-offset:2px;
}
.note-toggle:active {
  transform:scale(0.9);
}

/* CSS chevron arrow for note toggle */
.note-toggle .icon {
  display:flex;
  align-items:center;
  justify-content:center;
  width:10px;
  height:10px;
  transition:transform var(--duration-fast) var(--ease-out);
}
.note-toggle .icon::after {
  content:'';
  display:block;
  width:6px;
  height:6px;
  border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;
  transform:rotate(45deg);
}
.note.is-collapsed .note-toggle .icon {
  transform:rotate(-90deg);
}

/* Collapsed content */
.note .content {
  font-size:clamp(0.9375rem,1.8vw,1.0625rem);
  color:var(--c-text);
  line-height:1.9;
  white-space:pre-wrap;
  position:relative;
  z-index:1;
  overflow:hidden;
  transition:
    max-height var(--duration-normal) var(--ease-out),
    opacity var(--duration-normal) var(--ease-out);
}
.note .content.collapsed {
  max-height:3.8em !important;
  opacity:0.5;
}
.note.is-collapsed .content {
  max-height:3.8em !important;
  opacity:0.5;
}

/* ============================================
   Global Toggle
   ============================================ */
.global-toggle-wrap {
  display:flex;
  justify-content:flex-end;
  margin-bottom:var(--space-md);
}
.global-toggle {
  cursor:pointer;
  user-select:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:500;
  color:var(--c-text-muted);
  padding:6px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--c-border);
  background:var(--c-bg-card);
  transition:all var(--duration-fast) var(--ease-out);
  font-family:var(--font-sans);
  line-height:1.5;
}
.global-toggle:hover {
  color:var(--c-accent);
  border-color:var(--c-accent-subtle);
  background:var(--c-accent-glow);
}
.global-toggle:focus-visible {
  outline:2px solid var(--c-accent);
  outline-offset:2px;
}
.global-toggle:active {
  transform:scale(0.96);
}

.global-toggle-icon {
  transition:transform var(--duration-fast) var(--ease-out);
}
.global-toggle.all-collapsed .global-toggle-icon {
  transform:rotate(-90deg);
}

/* ============================================
   Sidebar
   ============================================ */
.sidebar {
  position:fixed;
  left:max(calc((100vw - 680px) / 2 - 140px),12px);
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:2px;
  z-index:100;
  max-height:80vh;
  overflow-y:auto;
  scrollbar-width:none;
}
.sidebar::-webkit-scrollbar { display:none; }

.sidebar a {
  position:relative;
  display:block;
  font-size:11px;
  font-weight:500;
  color:var(--c-text-muted);
  text-decoration:none;
  padding:6px 12px;
  border-radius:var(--radius-sm);
  transition:all var(--duration-fast) var(--ease-out);
  text-align:right;
  line-height:1.4;
  letter-spacing:0.02em;
}
.sidebar a:hover {
  color:var(--c-accent);
  background:var(--c-accent-glow);
}
.sidebar a:focus-visible {
  outline:2px solid var(--c-accent);
  outline-offset:-2px;
}
.sidebar a.active {
  color:var(--c-accent);
  background:var(--c-accent-glow);
  font-weight:600;
}
.sidebar a.active::before {
  content:'';
  position:absolute;
  right:-4px;
  top:50%;
  transform:translateY(-50%);
  width:4px;
  height:4px;
  background:var(--c-accent);
  border-radius:50%;
}

.sidebar .stats {
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--c-text-muted);
  text-align:right;
  padding:4px 12px 8px;
  margin-bottom:4px;
  border-bottom:1px solid var(--c-border-light);
  letter-spacing:0.03em;
}
.sidebar .stats strong {
  color:var(--c-accent);
  font-weight:600;
}

.sidebar a .preview {
  display:none;
  position:absolute;
  right:calc(100% + 12px);
  top:50%;
  transform:translateY(-50%);
  background:var(--c-bg-card);
  border:1px solid var(--c-border);
  border-radius:var(--radius-sm);
  padding:6px 12px;
  font-size:12px;
  font-weight:400;
  color:var(--c-text-secondary);
  white-space:nowrap;
  box-shadow:0 4px 12px var(--c-shadow-hover);
  pointer-events:none;
  line-height:1.5;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.sidebar a:hover .preview {
  display:block;
  animation:previewIn var(--duration-fast) var(--ease-out);
}
@keyframes previewIn {
  from { opacity:0; transform:translateY(-50%) translateX(4px); }
  to { opacity:1; transform:translateY(-50%) translateX(0); }
}

/* ============================================
   Scroll Progress
   ============================================ */
.scroll-progress {
  position:fixed;
  top:0;
  left:0;
  width:0;
  height:2px;
  background:linear-gradient(90deg,var(--c-accent),transparent);
  z-index:1000;
  transition:width 50ms linear;
}

/* ============================================
   Reduced Motion
   ============================================ */
/* ============================================
   Promo Banner — Link to Travel Guide
   ============================================ */
.promo-banner {
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(135deg,var(--c-accent-subtle),var(--c-bg-card));
  border:1px solid var(--c-accent-subtle);
  border-radius:var(--radius-md);
  padding:12px 18px;
  margin-bottom:var(--space-lg);
  text-decoration:none;
  transition:all var(--duration-fast) var(--ease-out);
  cursor:pointer;
}
.promo-banner:hover {
  border-color:var(--c-accent);
  box-shadow:0 2px 8px var(--c-accent-glow);
  transform:translateY(-1px);
}
.promo-banner:active {
  transform:translateY(0);
}
.promo-icon {
  font-size:1.2rem;
  line-height:1;
  flex-shrink:0;
}
.promo-text {
  flex:1;
  font-size:0.9rem;
  font-weight:500;
  color:var(--c-text);
  letter-spacing:0.01em;
}
.promo-arrow {
  flex-shrink:0;
  color:var(--c-accent);
  transition:transform var(--duration-fast) var(--ease-out);
}
.promo-banner:hover .promo-arrow {
  transform:translateX(3px);
}

@media (prefers-color-scheme:dark) {
  .promo-banner {
    background:linear-gradient(135deg,var(--c-accent-subtle),var(--c-bg-card));
  }
}

@media (prefers-reduced-motion:reduce) {
  .note { animation:none; opacity:1; transform:none; }
  .note:hover { transform:none; }
  .note:active { transform:none; }
  .sidebar a .preview { animation:none; }
  html { scroll-behavior:auto; }
}

/* ============================================
   Responsive
   ============================================ */
@media (max-width:960px) {
  .sidebar { display:none; }
  .container { padding:var(--space-xl) var(--space-md); }
}
@media (min-width:961px) and (max-width:1100px) {
  .sidebar { left:max(12px,calc((100vw - 680px)/2 - 110px)); }
  .sidebar a { padding:4px 8px; font-size:10px; }
}

/* ============================================
   Dark Mode
   ============================================ */
@media (prefers-color-scheme:dark) {
  :root {
    --c-bg:#1a1817;
    --c-bg-card:#242120;
    --c-text:#e8e0d8;
    --c-text-secondary:#a09890;
    --c-text-muted:#706860;
    --c-accent:#d4a37a;
    --c-accent-hover:#e0b890;
    --c-accent-subtle:#2d2825;
    --c-accent-glow:rgba(212,163,122,0.12);
    --c-border:#2d2825;
    --c-border-light:#2a2522;
    --c-shadow:rgba(0,0,0,0.2);
    --c-shadow-hover:rgba(0,0,0,0.4);
  }
  body {
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(212,163,122,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(212,163,122,0.04) 0%, transparent 50%);
  }
  .note::before {
    background:linear-gradient(135deg,transparent 60%,rgba(212,163,122,0.03));
  }
}

/* ============================================
   Filter Tabs
   ============================================ */
.filter-tabs {
  display:flex;
  gap:var(--space-sm);
  margin-bottom:var(--space-lg);
  flex-wrap:wrap;
}
.filter-tab {
  padding: 6px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--c-border);
  background: var(--c-bg-card);
  color: var(--c-text-muted);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
  font-family: var(--font-sans);
  line-height: 1.6;
  user-select: none;
}
.filter-tab:hover {
  border-color: var(--c-accent-subtle);
  color: var(--c-text-secondary);
}
.filter-tab.is-active {
  border-color: transparent;
}
.filter-tab[data-filter="all"].is-active { background: var(--c-accent-subtle); color: var(--c-accent); }
.filter-tab[data-filter="decision"].is-active { background: #f5ede4; color: #b8865a; }
.filter-tab[data-filter="people"].is-active { background: #f3e8e8; color: #b07a7a; }
.filter-tab[data-filter="goal"].is-active { background: #e4edf5; color: #4a7a9a; }

.tab-count {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:16px;
  padding:0 5px;
  border-radius:8px;
  font-size:10px;
  font-weight:600;
  font-family:var(--font-mono);
  line-height:1;
  background:rgba(128,128,128,0.1);
  vertical-align:middle;
  margin-left:2px;
}
.filter-tab.is-active .tab-count {
  background:rgba(255,255,255,0.4);
}

@media (prefers-color-scheme:dark) {
  .filter-tab[data-filter="decision"].is-active { background: #2d2825; color: #cba07a; }
  .filter-tab[data-filter="people"].is-active { background: #2d2825; color: #c09a9a; }
  .filter-tab[data-filter="goal"].is-active { background: #2a2d30; color: #7aadc9; }
}

/* ============================================
   Auth Overlay — Password Gate
   ============================================ */
.auth-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--c-bg);
  background-image:
    radial-gradient(ellipse at 30% 40%, rgba(200,145,106,0.05) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(200,145,106,0.03) 0%, transparent 50%);
}
.auth-card {
  background: var(--c-bg-card);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  padding: 40px;
  width: 340px;
  max-width: 88vw;
  box-shadow: 0 20px 60px var(--c-shadow-hover), 0 2px 8px var(--c-shadow);
  text-align: center;
}
.auth-card h2 {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--c-text);
  margin-bottom: 8px;
}
.auth-card .auth-sub {
  font-size: 0.85rem;
  color: var(--c-text-muted);
  margin-bottom: 28px;
  line-height: 1.5;
}
.auth-card input {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-sm);
  font-size: 0.9375rem;
  background: var(--c-bg);
  color: var(--c-text);
  outline: none;
  transition: border-color var(--duration-fast) var(--ease-out);
  box-sizing: border-box;
  font-family: var(--font-sans);
}
.auth-card input:focus {
  border-color: var(--c-accent);
}
.auth-card input::placeholder {
  color: var(--c-text-muted);
}
.auth-card button {
  width: 100%;
  margin-top: 14px;
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--c-accent);
  color: #fff;
  font-size: 0.9375rem;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease-out);
  font-family: var(--font-sans);
  line-height: 1.5;
  letter-spacing: 0.02em;
}
.auth-card button:hover {
  background: var(--c-accent-hover);
}
.auth-card button:active {
  transform: scale(0.98);
}
.auth-error {
  color: #c0392b;
  font-size: 0.8rem;
  margin-top: 14px;
  min-height: 1.2em;
  opacity: 0;
  transition: opacity var(--duration-normal) var(--ease-out);
}
.auth-error.is-show {
  opacity: 1;
}
@keyframes auth-shake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-6px); }
  40%,80% { transform: translateX(6px); }
}
.auth-card.is-shake {
  animation: auth-shake 0.4s var(--ease-out);
}
</style>

</head>
<body>
<!-- Auth Overlay -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card" id="authCard">
    <h2>随想笔记</h2>
    <p class="auth-sub">需要密码才能访问</p>
    <input type="password" id="authInput" placeholder="输入密码" autocomplete="off" spellcheck="false" />
    <button id="authBtn">进入</button>
    <p class="auth-error" id="authError">密码不对，再想想</p>
  </div>
</div>
<script>(function(){var k='dn_auth';if(localStorage.getItem(k)==='1'){var e=document.getElementById('authOverlay');if(e)e.style.display='none'}})()</script>

<div class="scroll-progress" id="scrollProgress"></div>

<div class="container">

const COLLAPSE_THRESHOLD = 10;

(async function() {
  'use strict';

  /* ===== 数据源：有压缩 blob 先解压，否则直接用 NOTES_DATA ===== */
  if (window.__NOTES_COMPRESSED__) {
    try {
      var __b64 = window.__NOTES_COMPRESSED__;
      var __bin = atob(__b64);
      var __bytes = new Uint8Array(__bin.length);
      for (var __i = 0; __i < __bin.length; __i++) __bytes[__i] = __bin.charCodeAt(__i);
      var __text = await new Response(new Blob([__bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      NOTES_DATA = JSON.parse(__text);
    } catch (__err) {
      document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;padding:10px 16px;font:12px/1.5 monospace;white-space:pre-wrap">数据解压失败：' + String(__err && __err.message || __err) + '</div>');
      return;
    }
  }

  const container = document.getElementById('notes-container');
  const sidebar = document.getElementById('sidebar');
  const globalToggle = document.getElementById('globalToggle');
  const notes = [];
  let allCollapsed = false;

  // Stats
  const statsEl = document.createElement('div');
  statsEl.className = 'stats';
  statsEl.innerHTML = '共 <strong>' + NOTES_DATA.length + '</strong> 篇 · 前' + COLLAPSE_THRESHOLD + '条展开';
  sidebar.appendChild(statsEl);

  // Tab counts
  var tabCounts = { decision: 0, people: 0, daily: 0, goal: 0 };
  NOTES_DATA.forEach(function(e) { var t = e.type || 'daily'; tabCounts[t]++; });
  document.getElementById('countAll').textContent = '(' + NOTES_DATA.length + ')';
  document.getElementById('countDecision').textContent = '(' + tabCounts.decision + ')';
  document.getElementById('countPeople').textContent = '(' + tabCounts.people + ')';
  document.getElementById('countDaily').textContent = '(' + tabCounts.daily + ')';
  document.getElementById('countGoal').textContent = '(' + tabCounts.goal + ')';

  // Phase 1: create notes
  NOTES_DATA.forEach(function(entry, i) {
    var index = i + 1;
    var label = '#' + String(index).padStart(3, '0');
    var isExpanded = i < COLLAPSE_THRESHOLD;

    var article = document.createElement('article');
    article.className = 'note' + (isExpanded ? '' : ' is-collapsed');
    article.id = 'note-' + i;
    article.dataset.type = entry.type || 'daily';
    article.style.animationDelay = (i * 0.04) + 's';

    var contentHtml = entry.content.replace(/\n/g, '<br>');

    article.innerHTML =
      '<div class="note-meta">' +
      '<span class="index">' + label + '</span>' +
      '<span class="date">' + entry.date + '</span>' +
      '<button class="note-toggle" aria-label="' + (isExpanded ? '收起' : '展开') + '" type="button"><span class="icon"></span></button>' +
      '</div>' +
      '<div class="content' + (isExpanded ? '' : ' collapsed') + '">' + contentHtml + '</div>';

    container.appendChild(article);
    notes.push(article);

    // Individual toggle
    var toggleBtn = article.querySelector('.note-toggle');
    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var wasCollapsed = article.classList.toggle('is-collapsed');
      article.querySelector('.content').classList.toggle('collapsed', wasCollapsed);
      toggleBtn.setAttribute('aria-label', wasCollapsed ? '展开' : '收起');

      // Sync global toggle
      var someCollapsed = notes.some(function(n) { return n.classList.contains('is-collapsed'); });
      if (!someCollapsed && allCollapsed) {
        allCollapsed = false;
        globalToggle.classList.remove('all-collapsed');
        document.querySelector('.global-toggle-text').textContent = '收起全部';
      } else if (someCollapsed && !allCollapsed) {
        allCollapsed = true;
        globalToggle.classList.add('all-collapsed');
        document.querySelector('.global-toggle-text').textContent = '展开全部';
      }
    });
  });

  // Global toggle
  globalToggle.addEventListener('click', function() {
    allCollapsed = !allCollapsed;
    globalToggle.classList.toggle('all-collapsed', allCollapsed);
    document.querySelector('.global-toggle-text').textContent = allCollapsed ? '展开全部' : '收起全部';

    notes.forEach(function(article, i) {
      var btn = article.querySelector('.note-toggle');
      var c = article.querySelector('.content');
      if (allCollapsed) {
        article.classList.add('is-collapsed');
        c.classList.add('collapsed');
        btn.setAttribute('aria-label', '展开');
      } else {
        var exp = i < COLLAPSE_THRESHOLD;
        article.classList.toggle('is-collapsed', !exp);
        c.classList.toggle('collapsed', !exp);
        btn.setAttribute('aria-label', exp ? '收起' : '展开');
      }
    });
  });

  // Phase 2: group by date, create sidebar links
  var dateGroups = new Map();
  notes.forEach(function(note, i) {
    var date = NOTES_DATA[i].date;
    if (!dateGroups.has(date)) dateGroups.set(date, []);
    dateGroups.get(date).push(note);
  });

  var dateItems = [];
  for (const [date, noteList] of dateGroups) {
    const firstId = noteList[0].id;
    const count = noteList.length;
    const label = count > 1 ? date + ' \xb7 ' + count + '篇' : date;

    var a = document.createElement('a');
    a.href = '#' + firstId;
    a.innerHTML = label;
    a.addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById(firstId).scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    sidebar.appendChild(a);
    dateItems.push({ el: a, noteEls: noteList });
  }

  // Map each note to its date group index
  var noteToGroup = [];
  dateItems.forEach(function(item, gIdx) {
    item.noteEls.forEach(function() { noteToGroup.push(gIdx); });
  });

  // Scroll spy
  if (notes.length) {
    var lastActive = -1;
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var noteIdx = notes.indexOf(entry.target);
          if (noteIdx !== -1) {
            var gIdx = noteToGroup[noteIdx];
            if (gIdx !== lastActive) {
              lastActive = gIdx;
              dateItems.forEach(function(item, i) {
                item.el.classList.toggle('active', i === gIdx);
              });
            }
          }
        }
      });
    }, { rootMargin: '-200px 0px -60% 0px' });
    notes.forEach(function(n) { observer.observe(n); });
  }

  // Scroll progress
  var progressBar = document.getElementById('scrollProgress');
  var updateProgress = function() {
    var scrollTop = window.scrollY;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    progressBar.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
  };
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress, { passive: true });
  updateProgress();

  // Filter tabs
  var filterTabs = document.querySelectorAll('.filter-tab');
  var currentFilter = 'all';

  function applyFilter() {
    notes.forEach(function(a) {
      var t = a.dataset.type || 'daily';
      a.style.display = (currentFilter === 'all' || t === currentFilter) ? '' : 'none';
    });
  }

  filterTabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      filterTabs.forEach(function(t) { t.classList.remove('is-active'); });
      tab.classList.add('is-active');
      currentFilter = tab.getAttribute('data-filter');
      applyFilter();
    });
  });

  // 默认命中「目标」筛选
  currentFilter = 'goal';
  applyFilter();

  // WeChat detection
  if (navigator.userAgent.indexOf('MicroMessenger') !== -1) {
    document.getElementById('wxTip').style.display = 'flex';
  }
})();
</script>
</body>
</html>
