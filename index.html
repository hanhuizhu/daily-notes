<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随想笔记 · daily notes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #faf9f8;
    color: #1d1d1f;
    line-height: 1.8;
  }
  .container { max-width: 680px; margin: 0 auto; padding: 48px 24px; }
  .header { margin-bottom: 40px; }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: #ff6b81; }
  .header .sub { font-size: 13px; color: #86868b; margin-top: 4px; }
  .header .line { width: 40px; height: 3px; background: #ff6b81; border-radius: 2px; margin-top: 16px; }
  .note { display: none; }
  .prompt {
    background: #fff;
    border: 1px solid #e8e8ed;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
  }
  .prompt .icon { font-size: 48px; margin-bottom: 12px; }
  .prompt h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .prompt p { font-size: 14px; color: #86868b; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📝 随想<span>笔记</span></h1>
    <div class="sub">记录日常生活中的灵光一闪</div>
    <div class="line"></div>
  </div>
  <div class="prompt">
    <div class="icon">✍️</div>
    <h2>还没有随想</h2>
    <p>用 <code>git push</code> 添加你的第一篇笔记</p>
  </div>
</div>
</body>
</html>
