(function() {
  'use strict';

  const container = document.getElementById('notes-container');
  const sidebar = document.getElementById('sidebar');
  const items = [];
  const notes = [];

  NOTES_DATA.forEach((entry, i) => {
    const index = i + 1;
    const id = 'note-' + i;
    const label = '#' + String(index).padStart(3, '0');

    // --- create note ---
    const article = document.createElement('article');
    article.className = 'note';
    article.id = id;
    article.style.animationDelay = (i * 0.05) + 's';

    article.innerHTML =
      '<div class="note-meta">' +
      '<span class="index">' + label + '</span>' +
      '<span class="date">' + entry.date + '</span>' +
      '</div>' +
      '<div class="content">' + entry.content.replace(/\n/g, '<br>') + '</div>';

    container.appendChild(article);
    notes.push(article);

    // --- create sidebar link ---
    const preview = entry.content.slice(0, 30);

    const a = document.createElement('a');
    a.href = '#' + id;
    a.innerHTML = label + '<span class="preview">' + preview + '…</span>';
    a.addEventListener('click', (e) => {
      e.preventDefault();
      article.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    sidebar.appendChild(a);
    items.push({ el: a, note: article });
  });

  // Scroll spy
  if (notes.length) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const idx = notes.indexOf(entry.target);
          if (idx !== -1) {
            items.forEach((item, i) => item.el.classList.toggle('active', i === idx));
          }
        }
      });
    }, { rootMargin: '-80px 0px -60% 0px' });
    notes.forEach(n => observer.observe(n));
  }

  // Scroll progress
  const progressBar = document.getElementById('scrollProgress');
  const updateProgress = () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    progressBar.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
  };
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress, { passive: true });
  updateProgress();

  // WeChat detection
  if (navigator.userAgent.includes('MicroMessenger')) {
    document.getElementById('wxTip').style.display = 'block';
  }
})();
</script>
</body>
</html>
