T的竖线（深度）：技术硬实力。资深前端，行业前10%，能打硬仗。这条线不能丢，是立身之本。

T的横线（广度）：业务 + 产品。能理解业务怎么运转、产品为什么这么设计、运营在操盘什么指标。

横线的价值：
· 跟业务团队聊时，不会停留在"你要什么功能"，而是"你要解决什么指标问题"
· 跟产品团队聊时，能判断"这个方案改了以后，对运营链路有什么影响"
· 自己设计系统时，能做出更少返工、更长寿命的架构

大部分研发只做竖线。少数做了横线但方向偏了——比如只追技术广度，跳各种框架。
横线的方向应该锚定在具体的业务场景上（电商、旅游），比泛泛的"全栈"要值钱得多。

业务 & 产品：把T的另一横补齐。`

运营的工作横跨这四个域，不是只落在"交易"这一个节点上。

每个节点上的运营工作形态：

【供应链节点】
采购什么商品、备多少货、什么时候补

【交易节点】
怎么定价、怎么展示、上什么活动
看的是页面和转化，指标是GMV、转化率、客单价

【履约节点】
交付体验怎么样、时效稳不稳定
看的是物流和时效，指标是妥投率、时效达标率

【售后节点】
客诉率高不高、退换货成本
看的是客诉和赔付，指标是售后率、NPS

贯穿整条链的核心指标：GMV、毛利、周转。

"卖什么"这个动作本质上属于供应链域——根据数据判断卖什么，不是运营域能独立决定的。

运营链路里的定价、内容、活动，都是在交易域的用户链路上加杠杆，服务于GMV和毛利。

运营在各个节点设参数、看数据、调效果，把整条链跑通。不是某一个域的事。`

同一套交易系统，存在两个截然不同的视角，服务于两个不同的角色。

【用户链路·前台体验】
触达 → 首页 → 列表 → 详情 → 提单 → 成交
看的是页面、价格、优惠，关心的是"买不买、划不划算"。
产品+技术团队围绕这条链路转。

【运营链路·后台管理】
卖什么 → 定什么价 → 配什么内容 → 上什么活动
看的是商品、定价策略、活动配置、数据分析。
业务团队 focus 这条链路——在现有系统里完成自己单点的 Job。

两个链路的根本差异：
用户的任务是"一次性购买决策"——线性的、有时间压力的、只看结果。
运营的任务是"持续性管理工作"——周期性 PDCA、关注配置效率和效果调优。

为什么不能完全融合？
抽象层级不同。用户看到的是渲染后的结果（¥29.9），运营操作的是原始数据+规则引擎（基础价+满减+会员折扣+时段促销+券叠加）。
强行合一 → C端变重、B端受限。

正确做法：数据层统一，应用层分离。
运营配置的"活动价"和用户看到的"¥99"是同一份数据模型，但呈现方式两套。
未来 AI agent 能替运营完成复杂配置时，两条链路的距离会拉近，但不会消失——消费者永远只需要结果，不需要知道过程。

三层团队的咬合方式：
业务团队 → 在现有系统里完成运营链路上的单点 Job
产品团队 → 设计用户链路 + 把运营需求翻译成系统能力
技术团队 → 搭系统底座，让两条链路跑通`

const COLLAPSE_THRESHOLD = 10;

(function() {
  'use strict';

  const container = document.getElementById('notes-container');
  const sidebar = document.getElementById('sidebar');
  const globalToggle = document.getElementById('globalToggle');
  const notes = [];
  let allCollapsed = false;

  // Stats
  const statsEl = document.createElement('div');
  statsEl.className = 'stats';
  statsEl.innerHTML = '共 <strong>' + NOTES_DATA.length + '</strong> 篇 · 前' + COLLAPSE_THRESHOLD + '条展开';
  sidebar.appendChild(statsEl);

  // Phase 1: create notes
  NOTES_DATA.forEach((entry, i) => {
    const index = i + 1;
    const label = '#' + String(index).padStart(3, '0');
    const isExpanded = i < COLLAPSE_THRESHOLD;

    const article = document.createElement('article');
    article.className = 'note' + (isExpanded ? '' : ' is-collapsed');
    article.id = 'note-' + i;
    article.style.animationDelay = (i * 0.05) + 's';

    const contentHtml = entry.content.replace(/\n/g, '<br>');

    article.innerHTML =
      '<div class="note-meta">' +
      '<span class="index">' + label + '</span>' +
      '<span class="date">' + entry.date + '</span>' +
      '<button class="note-toggle" aria-label="' + (isExpanded ? '收起' : '展开') + '"><span class="icon">' + (isExpanded ? '▼' : '▶') + '</span></button>' +
      '</div>' +
      '<div class="content' + (isExpanded ? '' : ' collapsed') + '">' + contentHtml + '</div>';

    container.appendChild(article);
    notes.push(article);

    // Individual toggle
    const toggleBtn = article.querySelector('.note-toggle');
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasCollapsed = article.classList.toggle('is-collapsed');
      article.querySelector('.content').classList.toggle('collapsed', wasCollapsed);
      toggleBtn.querySelector('.icon').textContent = wasCollapsed ? '▶' : '▼';
      toggleBtn.setAttribute('aria-label', wasCollapsed ? '展开' : '收起');

      // Sync global toggle
      const anyCollapsed = notes.some(n => n.classList.contains('is-collapsed'));
      if (!anyCollapsed && allCollapsed) { allCollapsed = false; globalToggle.textContent = '收起全部 ▾'; }
      else if (anyCollapsed && !allCollapsed) { allCollapsed = true; globalToggle.textContent = '展开全部 ▸'; }
    });
  });

  // Global toggle
  globalToggle.addEventListener('click', () => {
    allCollapsed = !allCollapsed;
    globalToggle.textContent = allCollapsed ? '展开全部 ▸' : '收起全部 ▾';

    notes.forEach((article, i) => {
      const btn = article.querySelector('.note-toggle');
      const c = article.querySelector('.content');
      if (allCollapsed) {
        article.classList.add('is-collapsed'); c.classList.add('collapsed');
        btn.querySelector('.icon').textContent = '▶'; btn.setAttribute('aria-label', '展开');
      } else {
        const exp = i < COLLAPSE_THRESHOLD;
        article.classList.toggle('is-collapsed', !exp); c.classList.toggle('collapsed', !exp);
        btn.querySelector('.icon').textContent = exp ? '▼' : '▶';
        btn.setAttribute('aria-label', exp ? '收起' : '展开');
      }
    });
  });

  // Phase 2: group by date, create sidebar links (one per unique date)
  const dateGroups = new Map();
  notes.forEach((note, i) => {
    const date = NOTES_DATA[i].date;
    if (!dateGroups.has(date)) dateGroups.set(date, []);
    dateGroups.get(date).push(note);
  });

  const dateItems = [];
  for (const [date, noteList] of dateGroups) {
    const firstId = noteList[0].id;
    const count = noteList.length;
    const label = count > 1 ? date + ' · ' + count + '篇' : date;

    const a = document.createElement('a');
    a.href = '#' + firstId;
    a.innerHTML = label;
    a.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById(firstId).scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    sidebar.appendChild(a);
    dateItems.push({ el: a, noteEls: noteList });
  }

  // Map each note to its date group index
  const noteToGroup = [];
  dateItems.forEach((item, gIdx) => {
    item.noteEls.forEach(() => noteToGroup.push(gIdx));
  });

  // Scroll spy (per date group)
  if (notes.length) {
    let lastActive = -1;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const noteIdx = notes.indexOf(entry.target);
          if (noteIdx !== -1) {
            const gIdx = noteToGroup[noteIdx];
            if (gIdx !== lastActive) {
              lastActive = gIdx;
              dateItems.forEach((item, i) => item.el.classList.toggle('active', i === gIdx));
            }
          }
        }
      });
    }, { rootMargin: '-80px 0px -60% 0px' });
    notes.forEach(n => observer.observe(n));
  }

  // Scroll progress
  const progressBar = document.getElementById('scrollProgress');
  const updateProgress = () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    progressBar.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
  };
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress, { passive: true });
  updateProgress();

  // WeChat detection
  if (navigator.userAgent.includes('MicroMessenger')) {
    document.getElementById('wxTip').style.display = 'block';
  }
})();
</script>
