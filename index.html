<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随想笔记 · daily notes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #faf9f8;
    color: #1d1d1f;
    line-height: 1.8;
  }
  .container { max-width: 680px; margin: 0 auto; padding: 48px 24px; }
  .header { margin-bottom: 40px; }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: #ff6b81; }
  .header .sub { font-size: 13px; color: #86868b; margin-top: 4px; }
  .header .line { width: 40px; height: 3px; background: #ff6b81; border-radius: 2px; margin-top: 16px; }
  .note {
    background: #fff;
    border: 1px solid #e8e8ed;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
  }
  .note .date {
    font-size: 11px;
    color: #b0b0b0;
    margin-bottom: 10px;
  }
  .note .date::before { content: '📅 '; }
  .note .content {
    font-size: 15px;
    color: #1d1d1f;
    line-height: 1.9;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📝 随想<span>笔记</span></h1>
    <div class="sub">记录日常生活中的灵光一闪</div>
    <div class="line"></div>
  </div>
  <div class="note">
    <div class="date">2026-05-16</div>
    <div class="content">一个人维持生存每天只需要2000大卡的能量，通过合理分配蛋白质、碳水等营养物质，大概只需要10块钱。也就是说每天花10块钱就不会饿死。但我们为什么会投入大把时间和精力在生产上，并为此感到极致的痛苦？</div>
  </div>
  <div class="note">
    <div class="date">2026-05-16</div>
    <div class="content">普通百姓通过劳作创造的财富，60%服务于基础需求，20%服务于精神需求，剩余20%用于日常应急，其中约10%可能用于存储。可见，大部分精力还是在服务于温饱，只有很小一部分投入到精神世界之中。</div>
  </div>
</div>
</body>
</html>
