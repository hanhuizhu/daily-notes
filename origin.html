<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随想笔记 · daily notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================
   Design System — Design Tokens
   ============================================ */
:root {
  --c-bg: #f5f0eb;
  --c-bg-card: #fffcf8;
  --c-text: #2d2a24;
  --c-text-secondary: #8b8178;
  --c-text-muted: #b0a79e;
  --c-accent: #c8916a;
  --c-accent-hover: #b88055;
  --c-accent-subtle: #f0e6dc;
  --c-accent-glow: rgba(200, 145, 106, 0.12);
  --c-border: #e8e0d8;
  --c-border-light: #f0ebe5;
  --c-shadow: rgba(80, 60, 40, 0.06);
  --c-shadow-hover: rgba(80, 60, 40, 0.12);
  --font-serif: "Noto Serif SC","Source Han Serif SC","STSong",Georgia,serif;
  --font-sans: -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono: ui-monospace,"SF Mono","Cascadia Code",monospace;
  --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px; --space-xl:32px; --space-2xl:48px; --space-3xl:64px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --duration-fast:200ms; --duration-normal:400ms; --duration-slow:600ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }
body {
  font-family:var(--font-sans); background:var(--c-bg); color:var(--c-text); line-height:1.8;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(200,145,106,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(200,145,106,0.03) 0%, transparent 50%);
  background-attachment:fixed;
  min-height:100dvh;
}

/* ============================================
   Layout — Asymmetric Container
   ============================================ */
.container {
  max-width:680px;
  margin:0 auto;
  padding:var(--space-3xl) var(--space-lg);
  position:relative;
}

/* Decorative accent — offset circle for asymmetry */
.container::before {
  content:'';
  position:absolute;
  top:40px;
  right:-80px;
  width:200px;
  height:200px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(200,145,106,0.04) 0%, transparent 60%);
  pointer-events:none;
  display:none;
}
@media (min-width:1100px) {
  .container::before { display:block; }
}

/* ============================================
   WeChat Tip
   ============================================ */
.wx-tip {
  display:none;
  background:linear-gradient(135deg,#fef8e0,#fdf0d0);
  border:1px solid #f0dba8;
  border-radius:var(--radius-md);
  padding:12px 20px;
  margin-bottom:var(--space-lg);
  font-size:13px;
  color:#8d6e00;
  align-items:center;
  gap:8px;
  line-height:1.5;
}
.wx-tip strong { color:#b85a00; }
.wx-tip svg { flex-shrink:0; opacity:0.7; }

/* ============================================
   Header
   ============================================ */
.header {
  margin-bottom:var(--space-2xl);
  position:relative;
}
.header h1 {
  font-family:var(--font-serif);
  font-size:clamp(1.75rem,4vw,2.5rem);
  font-weight:700;
  letter-spacing:-0.02em;
  color:var(--c-text);
  line-height:1.3;
  display:flex;
  align-items:center;
  gap:12px;
}
.header h1 .header-icon {
  flex-shrink:0;
  color:var(--c-accent);
  opacity:0.7;
  width:clamp(22px,3vw,28px);
  height:clamp(22px,3vw,28px);
}
.header h1 .accent {
  color:var(--c-accent);
}
.header .sub {
  font-size:clamp(0.8125rem,1.5vw,0.9375rem);
  color:var(--c-text-secondary);
  margin-top:var(--space-sm);
  line-height:1.5;
  padding-left:clamp(34px,calc(22px + 12px),40px);
}
.header .line {
  width:96px;
  height:3px;
  background:linear-gradient(90deg,var(--c-accent),transparent);
  border-radius:2px;
  margin-top:var(--space-lg);
  margin-left:clamp(34px,calc(22px + 12px),40px);
}

/* ============================================
   Notes — Cards
   ============================================ */
@keyframes noteIn {
  from { opacity:0; transform:translateY(16px); }
  to { opacity:1; transform:translateY(0); }
}

.note {
  background:var(--c-bg-card);
  border:1px solid var(--c-border);
  border-radius:var(--radius-lg);
  padding:var(--space-xl) var(--space-lg);
  margin-bottom:var(--space-md);
  position:relative;
  transition:
    transform var(--duration-normal) var(--ease-out),
    box-shadow var(--duration-normal) var(--ease-out),
    border-color var(--duration-normal) var(--ease-out);
  box-shadow:
    0 1px 2px rgba(80,60,40,0.04),
    0 20px 40px -15px rgba(80,60,40,0.05);
  animation:noteIn 0.5s var(--ease-out) both;
}
.note::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:var(--radius-lg);
  background:linear-gradient(135deg,transparent 60%,rgba(200,145,106,0.02));
  pointer-events:none;
}
.note:hover {
  transform:translateY(-2px);
  box-shadow:0 4px 16px var(--c-shadow-hover),0 2px 4px rgba(80,60,40,0.06);
  border-color:var(--c-accent-subtle);
}
.note:active {
  transform:translateY(-1px);
}

/* Note meta row */
.note-meta {
  display:flex;
  align-items:center;
  gap:var(--space-sm);
  margin-bottom:var(--space-md);
  position:relative;
  z-index:1;
}

.note .index {
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  color:var(--c-accent);
  background:var(--c-accent-subtle);
  padding:2px 10px;
  border-radius:10px;
  letter-spacing:0.02em;
  line-height:1.6;
}

.note .date {
  font-size:12px;
  color:var(--c-text-muted);
  display:flex;
  align-items:center;
  gap:4px;
}
.note .date::before {
  content:'';
  display:inline-block;
  width:3px;
  height:3px;
  background:var(--c-text-muted);
  border-radius:50%;
  margin-right:2px;
}

/* Toggle button */
.note-toggle {
  margin-left:auto;
  cursor:pointer;
  user-select:none;
  display:flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:8px;
  transition:all var(--duration-fast) var(--ease-out);
  background:transparent;
  border:none;
  font-family:var(--font-sans);
  color:var(--c-text-muted);
  line-height:1;
}
.note-toggle:hover {
  color:var(--c-accent);
  background:var(--c-accent-glow);
}
.note-toggle:focus-visible {
  outline:2px solid var(--c-accent);
  outline-offset:2px;
}
.note-toggle:active {
  transform:scale(0.9);
}

/* CSS chevron arrow for note toggle */
.note-toggle .icon {
  display:flex;
  align-items:center;
  justify-content:center;
  width:10px;
  height:10px;
  transition:transform var(--duration-fast) var(--ease-out);
}
.note-toggle .icon::after {
  content:'';
  display:block;
  width:6px;
  height:6px;
  border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;
  transform:rotate(45deg);
}
.note.is-collapsed .note-toggle .icon {
  transform:rotate(-90deg);
}

/* Collapsed content */
.note .content {
  font-size:clamp(0.9375rem,1.8vw,1.0625rem);
  color:var(--c-text);
  line-height:1.9;
  white-space:pre-wrap;
  position:relative;
  z-index:1;
  overflow:hidden;
  transition:
    max-height var(--duration-normal) var(--ease-out),
    opacity var(--duration-normal) var(--ease-out);
}
.note .content.collapsed {
  max-height:3.8em !important;
  opacity:0.5;
}
.note.is-collapsed .content {
  max-height:3.8em !important;
  opacity:0.5;
}

/* ============================================
   Global Toggle
   ============================================ */
.global-toggle-wrap {
  display:flex;
  justify-content:flex-end;
  margin-bottom:var(--space-md);
}
.global-toggle {
  cursor:pointer;
  user-select:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:500;
  color:var(--c-text-muted);
  padding:6px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--c-border);
  background:var(--c-bg-card);
  transition:all var(--duration-fast) var(--ease-out);
  font-family:var(--font-sans);
  line-height:1.5;
}
.global-toggle:hover {
  color:var(--c-accent);
  border-color:var(--c-accent-subtle);
  background:var(--c-accent-glow);
}
.global-toggle:focus-visible {
  outline:2px solid var(--c-accent);
  outline-offset:2px;
}
.global-toggle:active {
  transform:scale(0.96);
}

.global-toggle-icon {
  transition:transform var(--duration-fast) var(--ease-out);
}
.global-toggle.all-collapsed .global-toggle-icon {
  transform:rotate(-90deg);
}

/* ============================================
   Sidebar
   ============================================ */
.sidebar {
  position:fixed;
  left:max(calc((100vw - 680px) / 2 - 140px),12px);
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:2px;
  z-index:100;
  max-height:80vh;
  overflow-y:auto;
  scrollbar-width:none;
}
.sidebar::-webkit-scrollbar { display:none; }

.sidebar a {
  position:relative;
  display:block;
  font-size:11px;
  font-weight:500;
  color:var(--c-text-muted);
  text-decoration:none;
  padding:6px 12px;
  border-radius:var(--radius-sm);
  transition:all var(--duration-fast) var(--ease-out);
  text-align:right;
  line-height:1.4;
  letter-spacing:0.02em;
}
.sidebar a:hover {
  color:var(--c-accent);
  background:var(--c-accent-glow);
}
.sidebar a:focus-visible {
  outline:2px solid var(--c-accent);
  outline-offset:-2px;
}
.sidebar a.active {
  color:var(--c-accent);
  background:var(--c-accent-glow);
  font-weight:600;
}
.sidebar a.active::before {
  content:'';
  position:absolute;
  right:-4px;
  top:50%;
  transform:translateY(-50%);
  width:4px;
  height:4px;
  background:var(--c-accent);
  border-radius:50%;
}

.sidebar .stats {
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--c-text-muted);
  text-align:right;
  padding:4px 12px 8px;
  margin-bottom:4px;
  border-bottom:1px solid var(--c-border-light);
  letter-spacing:0.03em;
}
.sidebar .stats strong {
  color:var(--c-accent);
  font-weight:600;
}

.sidebar a .preview {
  display:none;
  position:absolute;
  right:calc(100% + 12px);
  top:50%;
  transform:translateY(-50%);
  background:var(--c-bg-card);
  border:1px solid var(--c-border);
  border-radius:var(--radius-sm);
  padding:6px 12px;
  font-size:12px;
  font-weight:400;
  color:var(--c-text-secondary);
  white-space:nowrap;
  box-shadow:0 4px 12px var(--c-shadow-hover);
  pointer-events:none;
  line-height:1.5;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.sidebar a:hover .preview {
  display:block;
  animation:previewIn var(--duration-fast) var(--ease-out);
}
@keyframes previewIn {
  from { opacity:0; transform:translateY(-50%) translateX(4px); }
  to { opacity:1; transform:translateY(-50%) translateX(0); }
}

/* ============================================
   Scroll Progress
   ============================================ */
.scroll-progress {
  position:fixed;
  top:0;
  left:0;
  width:0;
  height:2px;
  background:linear-gradient(90deg,var(--c-accent),transparent);
  z-index:1000;
  transition:width 50ms linear;
}

/* ============================================
   Reduced Motion
   ============================================ */
/* ============================================
   Promo Banner — Link to Travel Guide
   ============================================ */
.promo-banner {
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(135deg,var(--c-accent-subtle),var(--c-bg-card));
  border:1px solid var(--c-accent-subtle);
  border-radius:var(--radius-md);
  padding:12px 18px;
  margin-bottom:var(--space-lg);
  text-decoration:none;
  transition:all var(--duration-fast) var(--ease-out);
  cursor:pointer;
}
.promo-banner:hover {
  border-color:var(--c-accent);
  box-shadow:0 2px 8px var(--c-accent-glow);
  transform:translateY(-1px);
}
.promo-banner:active {
  transform:translateY(0);
}
.promo-icon {
  font-size:1.2rem;
  line-height:1;
  flex-shrink:0;
}
.promo-text {
  flex:1;
  font-size:0.9rem;
  font-weight:500;
  color:var(--c-text);
  letter-spacing:0.01em;
}
.promo-arrow {
  flex-shrink:0;
  color:var(--c-accent);
  transition:transform var(--duration-fast) var(--ease-out);
}
.promo-banner:hover .promo-arrow {
  transform:translateX(3px);
}

@media (prefers-color-scheme:dark) {
  .promo-banner {
    background:linear-gradient(135deg,var(--c-accent-subtle),var(--c-bg-card));
  }
}

@media (prefers-reduced-motion:reduce) {
  .note { animation:none; opacity:1; transform:none; }
  .note:hover { transform:none; }
  .note:active { transform:none; }
  .sidebar a .preview { animation:none; }
  html { scroll-behavior:auto; }
}

/* ============================================
   Responsive
   ============================================ */
@media (max-width:960px) {
  .sidebar { display:none; }
  .container { padding:var(--space-xl) var(--space-md); }
}
@media (min-width:961px) and (max-width:1100px) {
  .sidebar { left:max(12px,calc((100vw - 680px)/2 - 110px)); }
  .sidebar a { padding:4px 8px; font-size:10px; }
}

/* ============================================
   Dark Mode
   ============================================ */
@media (prefers-color-scheme:dark) {
  :root {
    --c-bg:#1a1817;
    --c-bg-card:#242120;
    --c-text:#e8e0d8;
    --c-text-secondary:#a09890;
    --c-text-muted:#706860;
    --c-accent:#d4a37a;
    --c-accent-hover:#e0b890;
    --c-accent-subtle:#2d2825;
    --c-accent-glow:rgba(212,163,122,0.12);
    --c-border:#2d2825;
    --c-border-light:#2a2522;
    --c-shadow:rgba(0,0,0,0.2);
    --c-shadow-hover:rgba(0,0,0,0.4);
  }
  body {
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(212,163,122,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(212,163,122,0.04) 0%, transparent 50%);
  }
  .note::before {
    background:linear-gradient(135deg,transparent 60%,rgba(212,163,122,0.03));
  }
}

/* ============================================
   Filter Tabs
   ============================================ */
.filter-tabs {
  display:flex;
  gap:var(--space-sm);
  margin-bottom:var(--space-lg);
  flex-wrap:wrap;
}
.filter-tab {
  padding: 6px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--c-border);
  background: var(--c-bg-card);
  color: var(--c-text-muted);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
  font-family: var(--font-sans);
  line-height: 1.6;
  user-select: none;
}
.filter-tab:hover {
  border-color: var(--c-accent-subtle);
  color: var(--c-text-secondary);
}
.filter-tab.is-active {
  border-color: transparent;
}
.filter-tab[data-filter="all"].is-active { background: var(--c-accent-subtle); color: var(--c-accent); }
.filter-tab[data-filter="decision"].is-active { background: #f5ede4; color: #b8865a; }
.filter-tab[data-filter="people"].is-active { background: #f3e8e8; color: #b07a7a; }
.filter-tab[data-filter="goal"].is-active { background: #e4edf5; color: #4a7a9a; }

.tab-count {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:16px;
  padding:0 5px;
  border-radius:8px;
  font-size:10px;
  font-weight:600;
  font-family:var(--font-mono);
  line-height:1;
  background:rgba(128,128,128,0.1);
  vertical-align:middle;
  margin-left:2px;
}
.filter-tab.is-active .tab-count {
  background:rgba(255,255,255,0.4);
}

@media (prefers-color-scheme:dark) {
  .filter-tab[data-filter="decision"].is-active { background: #2d2825; color: #cba07a; }
  .filter-tab[data-filter="people"].is-active { background: #2d2825; color: #c09a9a; }
  .filter-tab[data-filter="goal"].is-active { background: #2a2d30; color: #7aadc9; }
}

/* ============================================
   Auth Overlay — Password Gate
   ============================================ */
.auth-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--c-bg);
  background-image:
    radial-gradient(ellipse at 30% 40%, rgba(200,145,106,0.05) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(200,145,106,0.03) 0%, transparent 50%);
}
.auth-card {
  background: var(--c-bg-card);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  padding: 40px;
  width: 340px;
  max-width: 88vw;
  box-shadow: 0 20px 60px var(--c-shadow-hover), 0 2px 8px var(--c-shadow);
  text-align: center;
}
.auth-card h2 {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--c-text);
  margin-bottom: 8px;
}
.auth-card .auth-sub {
  font-size: 0.85rem;
  color: var(--c-text-muted);
  margin-bottom: 28px;
  line-height: 1.5;
}
.auth-card input {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-sm);
  font-size: 0.9375rem;
  background: var(--c-bg);
  color: var(--c-text);
  outline: none;
  transition: border-color var(--duration-fast) var(--ease-out);
  box-sizing: border-box;
  font-family: var(--font-sans);
}
.auth-card input:focus {
  border-color: var(--c-accent);
}
.auth-card input::placeholder {
  color: var(--c-text-muted);
}
.auth-card button {
  width: 100%;
  margin-top: 14px;
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--c-accent);
  color: #fff;
  font-size: 0.9375rem;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease-out);
  font-family: var(--font-sans);
  line-height: 1.5;
  letter-spacing: 0.02em;
}
.auth-card button:hover {
  background: var(--c-accent-hover);
}
.auth-card button:active {
  transform: scale(0.98);
}
.auth-error {
  color: #c0392b;
  font-size: 0.8rem;
  margin-top: 14px;
  min-height: 1.2em;
  opacity: 0;
  transition: opacity var(--duration-normal) var(--ease-out);
}
.auth-error.is-show {
  opacity: 1;
}
@keyframes auth-shake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-6px); }
  40%,80% { transform: translateX(6px); }
}
.auth-card.is-shake {
  animation: auth-shake 0.4s var(--ease-out);
}
</style>

</head>
<body>
<!-- Auth Overlay -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card" id="authCard">
    <h2>随想笔记</h2>
    <p class="auth-sub">需要密码才能访问</p>
    <input type="password" id="authInput" placeholder="输入密码" autocomplete="off" spellcheck="false" />
    <button id="authBtn">进入</button>
    <p class="auth-error" id="authError">密码不对，再想想</p>
  </div>
</div>
<script>(function(){var k='dn_auth';if(localStorage.getItem(k)==='1'){var e=document.getElementById('authOverlay');if(e)e.style.display='none'}})()</script>

<div class="scroll-progress" id="scrollProgress"></div>

<div class="container">

- 虚拟物品不需要履约和供应，生成一次卖无数次，成本落在活客和交易上

二、但真正的分界线要再往前推一格
判断标准不是有没有实物在动，是第二份卖出去要不要再付一次成本
- 实物：每一件都要重造一遍、重运一遍，不可复制
- 人的时间：一份只能卖一次，不可复制
- 代码、内容、数据：一次生成，无限分发，可复制

中间那类最容易被误判成虚拟：在线教育、远程问诊、咨询、猎头、定制化SaaS实施。形态在线上，交付的却是人的时间，老师不能同时上两节一对一，照样是重履约。

三、成本结构决定了两件事
规模效应的方向相反
- 可复制的生意越大越赚，边际利润率随规模上升
- 不可复制的生意越大只是更大，毛利率不变，甚至因为管理半径失控而下降

利润被谁吃掉
- 重履约生意，利润被自己的成本吃掉：仓、车、人、店
- 轻履约生意，利润被渠道吃掉：应用商店抽成、买量成本逐年上涨
- 后半句常被忽略。虚拟生意省下的履约成本不会自动变成利润留在自己口袋，而是转移到了流量端。因为没有履约壁垒，竞争就全部涌向获客这一个战场，价格自然被抬到吃掉超额利润为止

四、所以重履约不全是坏事
- 一个事情难做，反而成为了你的护城河。难做意味着大部分人做不成、做不久、做不好，熬下来的少数人就自动拿到了定价权

    date: '2026-09-01',
    type: 'decision',
    content: `指标字典——投放、交易、营销三层的指标与口径

一、三层的关系
- 投放层解决把人带进来，交易层解决进来的人怎么转化，营销层解决用什么代价换来这些转化
- 投放核心公式：花了多少钱带来多少新客
- 交易核心公式：GMV = UV × 转化率 × 客单价
- 营销核心公式：增量收益 ÷ 补贴成本
- 三层的指标必须能对齐同一个订单，否则各说各话

二、投放层（公域）
- 曝光量，CPM = 千次曝光成本，衡量流量单价
- 点击量，CTR = 点击 ÷ 曝光，衡量素材吸引力
- CPC = 单次点击成本
- 到站率 = 落地页访问 ÷ 点击，这一层漏损常被忽略，很多点击根本没到页面
- CVR = 转化 ÷ 点击，CPA = 单次转化成本
- CAC = 总投放费用 ÷ 新客数，注意分母是新客不是总转化
- ROAS = 广告带来收入 ÷ 广告花费，分子建议用毛利不是GMV
- 素材维度：素材曝光、素材CTR、完播率、跑量占比、衰减周期
- 最关键的一条：转化事件回传口径决定平台优化方向。回传表单就会给你一堆爱填表的人，履约在线下的生意必须尽量把到店或核销这类深度事件回传上去

三、交易层
骨架公式
- GMV = UV × 转化率 × 客单价
- 拆细 = UV × 商详访问率 × 加购率 × 下单率 × 支付成功率 × 客单价
- 到店履约再加一环 = 上式 × 核销率 ×（客单价 + 加项金额）

流量层
- UV 独立访客，日周月UV不能相加，环比要同周期
- PV、人均PV、访问深度、跳出率
- 新老客占比、流量来源结构，各来源转化率差异极大必须分开看

商品曝光层，最常被漏掉的一层
- 商品曝光UV，曝光点击率 = 商详UV ÷ 商品曝光UV
- 坑位点击率、搜索有结果率、搜索点击率
- 站内UV高但商详UV低，问题在分发效率不在商品本身。不看这层会误判成货不行

商详层
- 商详UV，商详访问率 = 商详UV ÷ 站内UV
- 停留时长、跳出率
- 加购率 = 加购UV ÷ 商详UV
- 咨询率 = 咨询UV ÷ 商详UV，咨询率高说明信息没讲清楚，是商详优化的直接信号

加购层
- 加购UV、购物车到下单转化率
- 加购未下单率，这批人离成交最近，是最值钱的人群
- 加购留存 = 加购后N天内下单率

下单层
- 下单UV、订单数、下单转化率
- 口径要定死：一单多商品算几单，拆单合单怎么算

支付层，漏损常被低估
- 支付成功率 = 支付成功订单 ÷ 下单订单，通常漏10到30%
- 支付失败原因分布、下单到支付时长
- 很多是技术性漏损，比如渠道超时、优惠计算失败，修复ROI极高

履约层，纯电商没有这一层
- 核销率 = 核销订单 ÷ 支付订单，没核销的收入是假的
- 核销时长分布，决定日报会不会失真
- 过期未核销率
- 加项率和加项金额，客单价的重要来源，也是最容易被漏掉的收入指标
- 履约成功率，到店但服务未完成的比例，缺件缺工位门店拒接

售后层
- 退款率要分笔数口径和金额口径、退款原因分布、仅退款与退货退款占比、客诉率

复购层
- 复购率30/60/90天、购买频次、复购间隔看中位数不看均值
- 品类渗透率，跨品类购买用户占比，引流品客转高毛利品的关键指标
- 留存曲线

金额与效率
- GMV三口径：下单GMV含未支付偏高｜支付GMV｜核销GMV
- 优惠率 = 优惠总额 ÷ GMV，核心健康指标，失控就是在亏钱冲量
- 客单价 = GMV ÷ 订单数，件单价，ARPU = GMV ÷ 买家数
- 毛利额、毛利率、净GMV（扣退款）

四、营销层（优惠与活动）
券的生命周期
- 券曝光、发放量、领取量，领取率 = 领取 ÷ 曝光
- 核销率有两个口径，必须分开命名：
- 发放口径 = 核销 ÷ 发放，通常3到15%，反映整体效率
- 领取口径 = 核销 ÷ 领取，通常20到50%，反映领了的人用没用
- 同一批券两个数字差5到10倍，汇报不说口径等于没说数字
- 过期率、券库存消耗率

成本与效率
- 优惠率、单均优惠、补贴强度 = 优惠 ÷ 客单价
- 按出资方拆：平台承担额、商家承担额、品牌承担额
- 预算消耗率要实时监控防打穿
- 单位获客补贴 = 券成本 ÷ 新客数
- 优惠率必须能按品类、门店、出资方三个维度下钻。总体健康但某品类严重超标是常态

活动效果，最容易骗自己的地方
- 促销有四种效应，必须分开算：增量、时间挪移、品类替代、无效补贴
- 只有增量真正创造价值。平台后台的活动ROI把四个混在一起算，所以永远好看
- 总量ROI = 活动期毛利 ÷ 成本，会高估
- 增量ROI =（实验组 减 holdout组）毛利 ÷ 成本，唯一可信的ROI
- ROI分子必须是毛利不能是GMV。打五折冲GMV的ROI看着很高，实际每单在亏
- 活动前透支率、活动后回落率，回落越深说明时间挪移的成分越大

券的精准度
- 拉新占比 = 用券新客 ÷ 用券人数，判断券在拉新还是在补贴老客
- 唤醒率，召回券的效果
- 门槛达成率 = 达到门槛的领券人 ÷ 领券人，太低说明门槛定高了
- 凑单率和凑单金额，满减的核心价值来源。不算这个就不知道满减到底有没有用
- 无效补贴率，本来就会买却拿了券的比例，必须靠 holdout 才能算

风控与健康度
- 底价击穿拦截次数，非零就要查
- 异常订单率、单用户券使用集中度、同设备多账号率
- 资损金额、优惠计算失败率

五、最容易吵架的口径陷阱
- GMV三口径不说清。对外宣传常用下单GMV虚高，内部经营必须用支付或核销GMV
- 转化率的分母：除站内UV、除商详UV、除点击，差好几倍，必须写进指标字典
- UV去重周期：日周月不可加总
- 订单口径：一单多商品、拆单、合单各算几单
- 时间归属：下单日、支付日、核销日。到店生意建议经营看核销日、投放效果看下单日，两套并行且明确标注
- 退款是否冲减：建议同时看总GMV和净GMV，不要只留一个
- GMV按原价还是实付：主流按实付，按原价会虚高
- 券的发放、领取、到账是三个不同的分母
- 优惠金额含不含支付渠道优惠：通常不含，因为那笔钱不是你出的。积分和储值抵扣建议单独统计，不要混进优惠字段
- 活动业绩归属：一个订单命中多活动，按分摊金额比例归属。绝不能每个活动都算全额，否则各活动业绩加起来远超总GMV
- 新客定义：首次注册、首次下单、首次核销。到店生意建议用首次核销
- 增量还是总量：不标注就会被默认当成增量，这是最常见的误导

六、到店履约生意的特殊点
- 引流品券的价值不在本单。低价洗车、免费检测这类本单一定亏，真实价值 = 后续品类转化率 × 后续客单价 × 毛利率 × 二次到店率。只看本单ROI结论一定是别投了，必须建立券到首购品类到复购品类的跨单追踪
- 券过期率天然偏高。服务要预约、决策链条长，有效期要匹配服务周期，比服务周期略短制造紧迫感但别太短。过期前提醒的核销挽回率应该单独作为指标看
- 成本承担必须下钻到门店。门店不知道这笔优惠是谁掏的，就会怀疑是自己在补贴，这是真实的运营摩擦，指标透明能直接解决

- 基础类目：唯一一棵树，商品单归属且必须挂叶子，管属性模板、统计口径、结算佣金税率、搜索类目预测，变更成本极高

- 原则是基础类目求稳，业务类目求快
- 会被下游硬依赖的挂基础类目，会被运营天天改的挂业务类目

二、业务类目别只能圈基础类目
- 纯靠圈类目粒度不够
- 新能源专区：商品散落在多个类目下，同一类目里燃油新能源混着，圈不出来
- 冬季轮胎：是轮胎类目下按属性区分的，圈不出来
- 选品规则要支持三层：圈类目、类目加属性条件、白名单黑名单SKU

- 不要试图原子性完成迁移，那会阻塞业务，而且往往发生在大促前
- 做法：建子类目的同时自动建"待归类"兜底节点，存量一次性平移下去，类目树立刻恢复合法状态

- 最后给"待归类"设SLA和占比告警，超阈值阻塞该分支的后续变更，用规则倒逼清理，比发邮件催有用

- 策略层：触发条件 × 目标人群 × 内容模板 × 实验配置
- 编排层：频控、去重、优先级仲裁、静默时段、削峰

- 通道层：各手机厂商通道路由和降级

    [一] LLM 理解图片的原理

    LLM 本身是纯文本模型。多模态理解图片的流程：

	各页面用户的意图流是一个从"宽到窄"、从"发散到收敛"的过程：

	【首页 → 泛浏览】
	用户没想好要什么，进来逛逛。banner在这里属于"内容推荐"的一部分——用户接受度高，甚至预期有活动入口。

	【列表页 → 筛选比较】
	用户有大致方向了（想买轮胎/机油），在列表里挑。banner会打断筛选节奏，把视线从商品列表拽到活动页。如果banner推的商品和当前列表品类一致还可以，否则就是干扰。
	⚠️ 有条件合理。banner内容必须和当前品类强相关。且banner面积不能吃掉太多商品露出的位置。

	【详情页 → 决策评估】
	用户已经点进来了，在看价格、规格、评价——正在做"买不买"的最后一公里判断。一个banner弹出去，用户可能就回不来了。详情页的每一个像素都应该服务于"帮他下决心"。
	❌ 不合理。干扰决策、增加跳出率。

	【提单页 → 完成交易】
	用户已经要付钱了。任何额外的信息、活动、推荐都在增加"放弃"的概率。这个页面的唯一目标是把交易走完，少即是多。

2. 解决留存问题 — 用户来了之后能不能留下来。核心抓手：新客首购后7天黄金窗口引导复购、沉默用户分层唤醒、会员体系建立身份锚定、标签+场景+精细化执行（对什么人、在什么时机、做什么事）。留存问题解决的是"池子密封得好不好"。

3. 解决复购问题 — 用户愿意反复回来。核心抓手：用完即购提醒、定期购/订阅、权益差驱动、RFM分层运营、产后记关怀。复购问题解决的是"池子里的鱼愿意反复游回来"。

三者关系：流量决定入口宽度，留存决定池子密封度，复购决定水的流动率。流量×留存×复购 = 增长的底座。缺一个，增长模型就不完整。

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
与技术领域的映射：流量 ↔ 性能 · 承接 ↔ 稳定性 · 复购 ↔ 效能
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

运营的每一个命题，背后都需要技术能力做底座。

【流量 ←→ 性能】
流量来了，系统接不接得住？
度量手段：首屏加载时间、API响应P99、并发水位、页面渲染耗时
技术抓手：性能优化（关键链路缓存/SSR/预加载）、扩容策略、CDN加速、首屏秒开率兜底
运营感知：流量峰值时页面不卡、下单不超时，用户不会在"想买"的那一刻因为慢而放弃

【承接 ←→ 稳定性】
用户进来了，系统稳不稳？
度量手段：接口可用率、错误率、事故响应时长MTTR、Crash率、核心链路兜底率
技术抓手：监控告警体系、灰度发布&回滚机制、容灾降级预案、限流熔断策略
运营感知：活动大促时不出事故、不出资损、不出客诉潮。运营敢往系统上叠加活动，因为技术告诉他们"稳的"

【复购 ←→ 效能】
用户愿意反复回来，团队能不能持续高效交付？
度量手段：需求吞吐率、需求交付周期、线上缺陷密度、CI/CD构建时长
技术抓手：工程基建（自动化测试/CI成熟度）、AI Coding渗透率、架构解耦降低改造成本、技术债务管控
运营感知：需求提出来能快速上线、改一个东西不牵连另一个东西、技术团队不是瓶颈

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
三层关系：度量 → 抓手 → 运营感知
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

【第一层：度量】
没有度量就没有管理。每个维度必须有明确的量化指标，且指标必须可获取、可追踪、可对比。
· 性能指标 = 运营的流量转化效率的底座
· 稳定性指标 = 运营的活动信心的底座
· 效能指标 = 运营的响应速度的底座

【第二层：抓手】
指标不会自己变好。每个指标背后必须有明确的改进动作和责任人。
· 性能抓手：技术团队做专项优化（首屏/接口/图片/缓存）
· 稳定性抓手：SRE体系+事故复盘机制+主动防御
· 效能抓手：工程能力建设+工具链投入+流程自动化

【第三层：运营感知】
技术做了事，运营要"感受到"。
· 性能优化了 → 运营看到转化率提升
· 稳定性加固了 → 运营敢在大促叠加更多活动
· 效能提升了 → 运营的需求排期从"两周"变成"三天"

三个层次缺一不可：没有度量就不知道好坏，没有抓手就没人干活，运营感知不到就是白做。
技术不是成本中心，是运营的三个命题能否跑通的底座。没有技术底座，流量是漏的、承接是脆的、复购是散的。`

    content: `运营的本质理解

运营就是做流量、做内容、做产品、做留存、做复购，最终把 GMV 和净利润做起来。

【运营的组织方式：按品类切分】
运营应该按照商品品类切分，而不是按职能切分。
自营电商的采销团队就是最好的例子——每个采销团队对一个品类的进销存、毛利、流量全链路负责。

品类切分的优势：
① 权责利对等——一个团队对品类的全链路结果负责，不是只负责某个环节
② 决策链路短——品类负责人在自己品类内做决策，不需要跨部门拉通
③ 数据闭环——品类的收入、成本、毛利、用户反馈都在一个团队视野里
④ 可衡量——每个品类是一个独立的损益单元，做得好不好一目了然
⑤ 可竞争——内部品类之间可以形成健康的竞争关系，各自找增长点

按职能切分的问题是：运营只负责流量，不管毛利；采购只负责成本，不管用户感受。
最后结果是每个人都在自己的 KPI 上做对的事，但整体未必对。

【运营的本质是"闭环"】
不是某一个环节做得好——流量大但留存低、内容好但转化差、复购高但毛利低，都不叫运营做得好。
是整条链路的效率：流量进来 → 内容承接 → 产品转化 → 留存复购 → 利润跑正。每个环节都不差，整体才是好的。`

最好的空间理解不是靠看地图，是靠走。从山脚到山顶、从东走到西——每一步都在更新你对这个空间的理解。你站上山顶回头看来的方向，那个全景是对你所有位移的奖励。

做投放要区分两层：

第一层「新流量获取」——站外投流（各主流平台）和线下低价服务引流。这部分才产生真金白银的CAC。投流CAC在行业头部水平，低价引流CAC显著更低（含补贴亏损）。关注指标是CAC、首单ROI、LTV/CAC，关键是把新客拉到池子里。

第二层「存量运营」——App推送、服务提醒、短信唤醒、会员日等。这部分触达成本几乎为零，不产生CAC，产生的是复购率/留存率/沉睡唤醒率。目标是把池子里的人反复捞出来消费。

两者不能混为一谈。总交易额跌了但CAC没变，问题在存量侧（推送策略/唤醒频率/触达方式）。CAC涨了才查投流侧（素材衰退/竞争加剧/人群包问题）。

【一、找替代品：哪些外部品要被自控品吃掉】

方法1：GMV × 毛利差排序法
按三级类目分组，算外部品占的GMV × (自控毛利率 - 外部毛利率)，按"替代潜力"降序排。top 10类目就是最先下手的。

方法2：同需求匹配法（更精确）
拉近30天搜索词数据，按需求聚类。对每个搜索词：如果有自控品在卖，对比自控vs外部在该词下的曝光、点击率、转化率、评分。如果没有自控品，标记为品类缺口。输出两个清单——A: 外部品占主导但自控品已存在（需优化自控品），B: 外部品占主导且无自控品（需开发引入）。

方法3：用户迁移路径法（长期视角）
找出近90天买过外部品A的用户，看他们下次购买流向。如果大量流向另一个外部品B，B也是替代候选。如果流向自控品C，说明A的客户可以被C接住，加大C的力度。如果流向了别的类目，说明这个品没有锁客能力，替换风险低。

—

【二、优化自控品：哪些品要改，改什么】

不是所有自控品都要改，先找"差一口气"的——有流量但转化不行。

三个信号：
信号A：有曝光但没人点（点击率低于类目均值）→ 问题在主图/标题。对比该搜索词下外部品top3的标题和主图，拆高频词规律，按top品的公式重写标题。
信号B：有人点但没人买（点击率正常，转化率低于均值）→ 问题在详情页/价格/评价。对比外部品top3的详情结构、价格带、评分。
信号C：有人买但留不住人（转化正常，复购率低）→ 问题在产品/售后。看差评关键词。

优化优先级：信号A > 信号B > 信号C。信号A离流量最近，改了带来的增量最大。

标题优化：拉取该搜索词下点击率top10的品，标题分词统计高频词频，缺什么补什么。不是自己编好标题，是从数据里拆出好标题的公式。

主图优化：拉取品类下点击率top10的品，记录构图方式、背景色、文字信息、角度，找共性模式。自控品不符合这个共性就改。

详情页优化：拉自控品的详情页停留时长和跳出率，对比外部品top3的详情结构顺序，找到跳失率最高的屏，那一屏的内容就是问题点。

营销位置优化：按GMV/转化效率排序各坑位（搜索>类目列表>首页推荐>活动页>购后推荐）。高转化坑位被外部品占着就替换，自控品在低转化坑位就先优化品本身再换坑位。

—

【三、执行节奏】

第一周（低hanging fruit）：跑方法1得top10替代目标类目；找出点击率最低的5个自控品改标题。
第二周（内容优化）：改那5个自控品的主图，盯CTR变化；跑方法2出品类缺口清单。
第三周（营销调整）：把优化后的自控品推到好坑位；对替代目标类目的外部品开始控量。
第四周（复盘）：前三周的GMV/毛利增量，决定继续加码还是换思路。

核心认知：这套方法能不能打出结果，取决于数据系统能不能支撑这些维度的拉取。先搞清楚在什么数据环境里，再动手。`

const COLLAPSE_THRESHOLD = 10;

(async function() {
  'use strict';

  /* ===== 数据源：有压缩 blob 先解压，否则直接用 NOTES_DATA ===== */
  if (window.__NOTES_COMPRESSED__) {
    try {
      var __b64 = window.__NOTES_COMPRESSED__;
      var __bin = atob(__b64);
      var __bytes = new Uint8Array(__bin.length);
      for (var __i = 0; __i < __bin.length; __i++) __bytes[__i] = __bin.charCodeAt(__i);
      var __text = await new Response(new Blob([__bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      NOTES_DATA = JSON.parse(__text);
    } catch (__err) {
      document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;padding:10px 16px;font:12px/1.5 monospace;white-space:pre-wrap">数据解压失败：' + String(__err && __err.message || __err) + '</div>');
      return;
    }
  }

  const container = document.getElementById('notes-container');
  const sidebar = document.getElementById('sidebar');
  const globalToggle = document.getElementById('globalToggle');
  const notes = [];
  let allCollapsed = false;

  // Stats
  const statsEl = document.createElement('div');
  statsEl.className = 'stats';
  statsEl.innerHTML = '共 <strong>' + NOTES_DATA.length + '</strong> 篇 · 前' + COLLAPSE_THRESHOLD + '条展开';
  sidebar.appendChild(statsEl);

  // Tab counts
  var tabCounts = { decision: 0, people: 0, daily: 0, goal: 0 };
  NOTES_DATA.forEach(function(e) { var t = e.type || 'daily'; tabCounts[t]++; });
  document.getElementById('countAll').textContent = '(' + NOTES_DATA.length + ')';
  document.getElementById('countDecision').textContent = '(' + tabCounts.decision + ')';
  document.getElementById('countPeople').textContent = '(' + tabCounts.people + ')';
  document.getElementById('countDaily').textContent = '(' + tabCounts.daily + ')';
  document.getElementById('countGoal').textContent = '(' + tabCounts.goal + ')';

  // Phase 1: create notes
  NOTES_DATA.forEach(function(entry, i) {
    var index = i + 1;
    var label = '#' + String(index).padStart(3, '0');
    var isExpanded = i < COLLAPSE_THRESHOLD;

    var article = document.createElement('article');
    article.className = 'note' + (isExpanded ? '' : ' is-collapsed');
    article.id = 'note-' + i;
    article.dataset.type = entry.type || 'daily';
    article.style.animationDelay = (i * 0.04) + 's';

    var contentHtml = entry.content.replace(/\n/g, '<br>');

    article.innerHTML =
      '<div class="note-meta">' +
      '<span class="index">' + label + '</span>' +
      '<span class="date">' + entry.date + '</span>' +
      '<button class="note-toggle" aria-label="' + (isExpanded ? '收起' : '展开') + '" type="button"><span class="icon"></span></button>' +
      '</div>' +
      '<div class="content' + (isExpanded ? '' : ' collapsed') + '">' + contentHtml + '</div>';

    container.appendChild(article);
    notes.push(article);

    // Individual toggle
    var toggleBtn = article.querySelector('.note-toggle');
    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var wasCollapsed = article.classList.toggle('is-collapsed');
      article.querySelector('.content').classList.toggle('collapsed', wasCollapsed);
      toggleBtn.setAttribute('aria-label', wasCollapsed ? '展开' : '收起');

      // Sync global toggle
      var someCollapsed = notes.some(function(n) { return n.classList.contains('is-collapsed'); });
      if (!someCollapsed && allCollapsed) {
        allCollapsed = false;
        globalToggle.classList.remove('all-collapsed');
        document.querySelector('.global-toggle-text').textContent = '收起全部';
      } else if (someCollapsed && !allCollapsed) {
        allCollapsed = true;
        globalToggle.classList.add('all-collapsed');
        document.querySelector('.global-toggle-text').textContent = '展开全部';
      }
    });
  });

  // Global toggle
  globalToggle.addEventListener('click', function() {
    allCollapsed = !allCollapsed;
    globalToggle.classList.toggle('all-collapsed', allCollapsed);
    document.querySelector('.global-toggle-text').textContent = allCollapsed ? '展开全部' : '收起全部';

    notes.forEach(function(article, i) {
      var btn = article.querySelector('.note-toggle');
      var c = article.querySelector('.content');
      if (allCollapsed) {
        article.classList.add('is-collapsed');
        c.classList.add('collapsed');
        btn.setAttribute('aria-label', '展开');
      } else {
        var exp = i < COLLAPSE_THRESHOLD;
        article.classList.toggle('is-collapsed', !exp);
        c.classList.toggle('collapsed', !exp);
        btn.setAttribute('aria-label', exp ? '收起' : '展开');
      }
    });
  });

  // Phase 2: group by date, create sidebar links
  var dateGroups = new Map();
  notes.forEach(function(note, i) {
    var date = NOTES_DATA[i].date;
    if (!dateGroups.has(date)) dateGroups.set(date, []);
    dateGroups.get(date).push(note);
  });

  var dateItems = [];
  for (const [date, noteList] of dateGroups) {
    const firstId = noteList[0].id;
    const count = noteList.length;
    const label = count > 1 ? date + ' \xb7 ' + count + '篇' : date;

    var a = document.createElement('a');
    a.href = '#' + firstId;
    a.innerHTML = label;
    a.addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById(firstId).scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    sidebar.appendChild(a);
    dateItems.push({ el: a, noteEls: noteList });
  }

  // Map each note to its date group index
  var noteToGroup = [];
  dateItems.forEach(function(item, gIdx) {
    item.noteEls.forEach(function() { noteToGroup.push(gIdx); });
  });

  // Scroll spy
  if (notes.length) {
    var lastActive = -1;
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var noteIdx = notes.indexOf(entry.target);
          if (noteIdx !== -1) {
            var gIdx = noteToGroup[noteIdx];
            if (gIdx !== lastActive) {
              lastActive = gIdx;
              dateItems.forEach(function(item, i) {
                item.el.classList.toggle('active', i === gIdx);
              });
            }
          }
        }
      });
    }, { rootMargin: '-200px 0px -60% 0px' });
    notes.forEach(function(n) { observer.observe(n); });
  }

  // Scroll progress
  var progressBar = document.getElementById('scrollProgress');
  var updateProgress = function() {
    var scrollTop = window.scrollY;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    progressBar.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
  };
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress, { passive: true });
  updateProgress();

  // Filter tabs
  var filterTabs = document.querySelectorAll('.filter-tab');
  var currentFilter = 'all';

  function applyFilter() {
    notes.forEach(function(a) {
      var t = a.dataset.type || 'daily';
      a.style.display = (currentFilter === 'all' || t === currentFilter) ? '' : 'none';
    });
  }

  filterTabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      filterTabs.forEach(function(t) { t.classList.remove('is-active'); });
      tab.classList.add('is-active');
      currentFilter = tab.getAttribute('data-filter');
      applyFilter();
    });
  });

  // 默认命中「目标」筛选
  currentFilter = 'goal';
  applyFilter();

  // WeChat detection
  if (navigator.userAgent.indexOf('MicroMessenger') !== -1) {
    document.getElementById('wxTip').style.display = 'flex';
  }
})();
</script>
</body>
